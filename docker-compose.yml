# Levanta MySQL + API + frontend:  docker compose up --build
# Requiere un archivo .env (copia .env.example). Tienda en http://localhost:3000, Swagger en http://localhost:8080/swagger-ui.html
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: pedidos
      MYSQL_USER: ${DB_USERNAME:-pedidos}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en .env}
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://db:3306/pedidos
      DB_USERNAME: ${DB_USERNAME:-pedidos}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env (mínimo 32 caracteres)}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-480}
      SHIPPING_FLAT_RATE: ${SHIPPING_FLAT_RATE:-99.00}
      SHIPPING_FREE_FROM: ${SHIPPING_FREE_FROM:-1500.00}
      MAX_QUANTITY_PER_ITEM: ${MAX_QUANTITY_PER_ITEM:-20}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo1234!}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  mysqldata:
